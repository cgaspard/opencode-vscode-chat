name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm test` passes a glob to `node --test`, which only
          # expands from Node 21 on — under 20 the whole suite silently failed
          # to run and CI went red on every push. 22 also matches the Node in
          # the Electron that VS Code 1.104 ships.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check-types
      - run: npm test
      # CHANGELOG.md is generated from releasenotes/*.yaml and ships in the
      # .vsix, so a stale one is a stale Marketplace tab.
      - run: node scripts/render-changelog.js --check
      # Bundle one representative target so the dev VSIX is a real, runnable
      # package (matches what Release produces). linux-x64 keeps CI fast.
      - run: node scripts/fetch-opencode.js linux-x64
      - run: npx vsce package --target linux-x64 --out opencode-chat-dev.vsix
      - name: Verify the dev VSIX bundled the binary
        run: |
          SIZE=$(unzip -l opencode-chat-dev.vsix extension/bin/opencode | awk '$4=="extension/bin/opencode" {print $1}')
          if [ -z "$SIZE" ] || [ "$SIZE" -lt 1000000 ]; then
            echo "::error::dev VSIX is missing extension/bin/opencode or it is too small ($SIZE bytes)"
            exit 1
          fi
          echo "OK: opencode bundled ($SIZE bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-chat-dev-vsix
          path: opencode-chat-dev.vsix
          if-no-files-found: error
          retention-days: 7
