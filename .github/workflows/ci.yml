name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm test` passes a glob to `node --test`, which only
          # expands from Node 21 on — under 20 the whole suite silently failed
          # to run and CI went red on every push. 22 also matches the Node in
          # the Electron that VS Code 1.104 ships.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check-types
      - run: npm test
      # CHANGELOG.md is generated from releasenotes/*.yaml and ships in the
      # .vsix, so a stale one is a stale Marketplace tab.
      - run: node scripts/render-changelog.js --check
      # Bundle one representative target so the dev VSIX is a real, runnable
      # package (matches what Release produces). linux-x64 keeps CI fast.
      - run: node scripts/build-opencode-sdk.js linux-x64
      - run: npx vsce package --target linux-x64 --out opencode-vscode-chat-dev.vsix
      - name: Verify the dev VSIX bundled the engine
        run: |
          VSIX=opencode-vscode-chat-dev.vsix
          SIZE=$(unzip -l "$VSIX" extension/opencode-sdk/sdk.mjs | awk '$4=="extension/opencode-sdk/sdk.mjs" {print $1}')
          if [ -z "$SIZE" ] || [ "$SIZE" -lt 1000000 ]; then
            echo "::error::dev VSIX is missing extension/opencode-sdk/sdk.mjs or it is too small ($SIZE bytes)"
            exit 1
          fi
          for NATIVE in @parcel/watcher-linux-x64-glibc @lydell/node-pty-linux-x64; do
            unzip -l "$VSIX" | grep -q "extension/opencode-sdk/node_modules/${NATIVE}/package.json" || { echo "::error::dev VSIX is missing ${NATIVE}"; exit 1; }
          done
          echo "OK: engine bundled ($SIZE bytes) with linux-x64 natives"
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-vscode-chat-dev-vsix
          path: opencode-vscode-chat-dev.vsix
          if-no-files-found: error
          retention-days: 7
