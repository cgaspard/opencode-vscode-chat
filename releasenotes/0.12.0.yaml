version: 0.12.0
date: 2026-09-04
highlights:
  - A llama.cpp server started with a large context is finally used at its real size. A 256K server reported 32K, and OpenCode packed and compacted against that — 87% of the window you paid GPU memory for went unused.
  - This release also promotes the 0.11.x pre-release work to stable — oMLX as a recognised local runtime, and OpenCode 1.18.26.
added:
  - llama.cpp's context window is now read. It publishes neither of the fields the picker knew about — vLLM's `max_model_len` and oMLX's `max_context_length` — and instead nests the window under `meta.n_ctx` on `/v1/models`, so a llama.cpp endpoint previously reported no window at all.
  - Where a llama.cpp server splits its context across slots with `--parallel N`, the per-request window is read from `/props` rather than assumed. `meta.n_ctx` is the window the whole process holds, so on a server started with `--parallel 4` it overstates what any single request gets by 4× — enough for OpenCode to build a prompt the server then refuses. The extra request is only made when a llama.cpp-shaped listing is actually seen.
  - oMLX joins LM Studio, Ollama and vLLM as a detected local runtime. Because oMLX and vLLM both default to port 8000, detection reads the `/health` body for oMLX's `engine_pool` block rather than trusting the port, and a server found there is now labelled by what actually answered instead of always being offered as "vLLM".
  - Models served by oMLX are read from `/v1/models/status`, which carries the metadata its OpenAI-compatible `/v1/models` surface omits — `model_type: vlm` for multimodal models, the configured `max_context_window`, and load state. A model set up by hand as a plain OpenAI-compatible endpoint is also offered this richer listing, so it is not penalised for having been typed in rather than probed.
  - Where an oMLX model declares an alias, the alias is what the picker offers — that is the id its chat endpoint accepts, so selecting the on-disk name would have failed the request.
changed:
  - A local server that fixed its context window when it started is no longer shrunk to the `minContextLength` setting. That setting is a request made when a model loads, and only LM Studio has a load lifecycle to make that request of — a llama.cpp, vLLM or oMLX process was launched with `--ctx-size` (or its equivalent) and will not renegotiate, so the window it reports is the budget. Reading a 256K window and then declaring 32K to OpenCode was pure loss, and no single global setting can be right for a 256K llama.cpp server and 32K LM Studio models at the same time.
  - For those servers the context picker now states the window instead of offering presets, the same way it already did for a cloud provider — the presets would have rewritten a local setting and restarted the server for no effect. LM Studio keeps its adjustable presets, and so does any endpoint that reports no window of its own, because there the setting is still the only window anyone has named.
  - A window is only treated as fixed when the endpoint itself reported one. The picker also falls back to the limit written into our own generated config, which on an unreachable endpoint is just the `minContextLength` setting come back around — treating that as a reading from the server would have told you "the server says 32K, and you may not adjust it", when the setting is the one thing you can adjust.
  - A local endpoint that reports vision now overrides the capability written into our own generated config. That config records an absent value as an explicit `false`, so without this an oMLX-hosted multimodal model stayed marked text-only and had images stripped before the request.
  - vLLM and oMLX both advertise the served context as `max_model_len` on `/v1/models`, and that is now read. Previously the picker fell back to the `minContextLength` setting and reported a window unrelated to the server's real limit.
fixed:
  - The context meter no longer reports a window the server never agreed to. It read the `minContextLength` default whenever a runtime's context field went unrecognised, which looked like a detected capability rather than the fallback it was, and the picker did not even offer the server's real size as a preset to correct it by hand.
  - The provider on/off switches in the model panel are drawn correctly again — the knob sits centred in its pill instead of riding up and out of the top edge. The track had no padding or border of its own, so the knob's top margin collapsed straight through it.
  - The bundled OpenCode server moves from 1.18.17 to 1.18.26. Most relevant here - `textVerbosity` is no longer sent to OpenAI-compatible servers that reject it, a turn no longer stops early on a finish reason OpenCode does not recognise, failed subagent calls surface a resumable task id, and more network-error shapes are retried.
